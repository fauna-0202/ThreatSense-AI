version: "3.8"

services:
  backend:
    build: .
    container_name: threatsense-api
    command: uvicorn threatsense.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - THREATSENSE_ENV=production
      - DATABASE_URL=sqlite:///./data/threatsense.db
      - SENSOR_MODE=replay
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build: .
    container_name: threatsense-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - THREATSENSE_API_HOST=backend
      - THREATSENSE_API_PORT=8000
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
